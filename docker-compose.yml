services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: autoviz-pgvector
    environment:
      POSTGRES_USER: autoviz
      POSTGRES_PASSWORD: autoviz
      POSTGRES_DB: autoviz
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoviz -d autoviz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgvector_data:
