[project]
name = "autoviz"
version = "0.1.0"
description = "AutoViz — AI-powered CSV visualization pipeline"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pydantic-ai-slim[openai]>=0.0.39",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "modal>=0.73.0",
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
    "streamlit>=1.66.1",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
autoviz = "autoviz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoviz"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# app.py / cli.py / csv.py / pages 含中文界面与提示：全角标点是刻意的。
[tool.ruff.lint.per-file-ignores]
"app.py" = ["RUF001", "RUF002", "RUF003"]
"autoviz/cli.py" = ["RUF001", "RUF002", "RUF003"]
"autoviz/pipeline/csv.py" = ["RUF001", "RUF002", "RUF003"]
"autoviz/store/*.py" = ["RUF001", "RUF002", "RUF003"]
"autoviz/agents/summarizer.py" = ["RUF001", "RUF002", "RUF003"]
"pages/*.py" = ["RUF001", "RUF002", "RUF003"]
